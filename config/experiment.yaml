# Experiment-level settings. See README section 3.

paths:
  raw_dir: data/raw
  splits: data/processed/splits.json

split:
  seed: 42
  tuning_ratio: 0.5        # fraction of each source (expert, simulated) sent to tuning

corpus:
  article_types: all       # keep article, feature_request, known_issue (realistic distractors)

pipeline:                  # fixed across all configs (not genes)
  embedding_model: BAAI/bge-small-en-v1.5   # 512-token max input; caps chunk_size
  embedding_query_prefix: "Represent this sentence for searching relevant passages: "
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rrf_k: 60                # reciprocal rank fusion constant for hybrid retrieval

fitness:
  metric: ndcg
  k: 5                     # articles, independent of the top_k gene
  level: article           # retrieved chunks -> articles by first occurrence, duplicates dropped
  relevance: binary        # article relevant iff in the question's article_ids
  # ideal DCG assumes min(len(article_ids), k) relevant articles at the top

budgets: [0.05, 0.10, 0.20]  # fraction of unique valid configs , rounded down (570 -> 28, 57, 114)

